name: Feature request
description: Propose a capability that is not in the roadmap.
title: "feat(scope): Summary"
labels: ["enhancement"]
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/Agnidia/WardAxis/tree/master/roadmap) first.
        WardAxis ships only through the App Store: every shipped component is sandboxed and never runs as root.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do today, and who is affected.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      multiple: true
      options:
        - macOS
        - iOS/iPadOS
        - tvOS
        - Server
    validations:
      required: true
  - type: textarea
    id: app-store
    attributes:
      label: App Store impact
      description: New entitlements, privacy data, extensions or App Review guidelines involved. Write "none" when there is no impact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
